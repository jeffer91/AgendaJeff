<!--
  Nombre completo: index.html
  Ruta: index.html

  Función:
    - Shell raíz de AgendaJeff.
    - Navegar entre Inicio, Agenda, Masivo y Ajustes desde un menú superior.
    - Mantener Google Calendar, Telegram y Notificaciones como submenú de Ajustes.
    - Cargar módulos internos mediante iframe sin mezclar su lógica interna.
-->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaJeff</title>
  <style>
    :root {
      --aj-bg: #f4f7fb;
      --aj-card: #ffffff;
      --aj-text: #172033;
      --aj-muted: #667085;
      --aj-border: #d9e2ec;
      --aj-primary: #2563eb;
      --aj-primary-soft: #dbeafe;
      --aj-success: #15803d;
      --aj-success-soft: #ecfdf3;
      --aj-warning: #b45309;
      --aj-warning-soft: #fff7ed;
      --aj-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --aj-radius: 18px;
      --aj-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: var(--aj-font);
      background: var(--aj-bg);
      color: var(--aj-text);
    }

    button { font: inherit; }

    .aj-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      min-height: 100vh;
    }

    .aj-topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      background: var(--aj-card);
      border-bottom: 1px solid var(--aj-border);
      box-shadow: var(--aj-shadow);
      z-index: 10;
    }

    .aj-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .aj-brand-mark {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--aj-primary);
      color: #ffffff;
      font-weight: 900;
    }

    .aj-brand-text strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }

    .aj-brand-text span {
      display: block;
      color: var(--aj-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .aj-main-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .aj-menu-item,
    .aj-submenu-item,
    .aj-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid var(--aj-border);
      background: #ffffff;
      color: var(--aj-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .aj-menu-item {
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .aj-menu-item:hover,
    .aj-submenu-item:hover,
    .aj-chip:hover {
      border-color: var(--aj-primary);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    .aj-menu-item.is-active,
    .aj-submenu-item.is-active {
      border-color: var(--aj-primary);
      background: var(--aj-primary-soft);
      color: var(--aj-primary);
    }

    .aj-menu-group {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .aj-submenu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      display: grid;
      min-width: 260px;
      padding: 8px;
      border: 1px solid var(--aj-border);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: var(--aj-shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
      z-index: 20;
    }

    .aj-menu-group:hover .aj-submenu,
    .aj-menu-group:focus-within .aj-submenu,
    .aj-menu-group.is-open .aj-submenu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .aj-submenu::before {
      content: "";
      position: absolute;
      top: -11px;
      right: 22px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-left: 1px solid var(--aj-border);
      border-top: 1px solid var(--aj-border);
      transform: rotate(45deg);
    }

    .aj-submenu-title {
      margin: 2px 6px 8px;
      color: var(--aj-muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .aj-submenu-item {
      position: relative;
      justify-content: flex-start;
      width: 100%;
      margin: 0 0 6px;
      padding: 11px 12px;
      border-radius: 12px;
      text-align: left;
    }

    .aj-submenu-item:last-child { margin-bottom: 0; }

    .aj-topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .aj-runtime-badge,
    .aj-chip {
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--aj-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .aj-chip {
      font-weight: 800;
    }

    .aj-runtime-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--aj-border);
      background: #ffffff;
      font-weight: 800;
    }

    .aj-runtime-badge.is-ok {
      border-color: rgba(21, 128, 61, 0.25);
      background: rgba(21, 128, 61, 0.08);
      color: var(--aj-success);
    }

    .aj-runtime-badge.is-warn {
      border-color: rgba(180, 83, 9, 0.25);
      background: var(--aj-warning-soft);
      color: var(--aj-warning);
    }

    .aj-layout {
      display: grid;
      min-height: 0;
      padding: 18px;
    }

    .aj-content-card {
      display: grid;
      min-width: 0;
      min-height: calc(100vh - 132px);
      padding: 0;
      overflow: hidden;
      background: var(--aj-card);
      border: 1px solid var(--aj-border);
      border-radius: var(--aj-radius);
      box-shadow: var(--aj-shadow);
    }

    .aj-module-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 134px);
      border: 0;
      background: #ffffff;
    }

    .aj-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--aj-card);
      border-top: 1px solid var(--aj-border);
      color: var(--aj-muted);
      font-size: 13px;
    }

    @media (max-width: 1080px) {
      .aj-topbar {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .aj-main-menu {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .aj-topbar-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 700px) {
      .aj-layout { padding: 10px; }
      .aj-footer { align-items: flex-start; flex-direction: column; }
      .aj-main-menu { display: grid; grid-template-columns: 1fr 1fr; }
      .aj-menu-group { display: grid; }
      .aj-menu-item { width: 100%; }
      .aj-submenu { left: 0; right: auto; min-width: min(320px, calc(100vw - 20px)); }
      .aj-content-card,
      .aj-module-frame { min-height: 720px; }
    }
  </style>
</head>
<body>
  <div class="aj-shell">
    <header class="aj-topbar">
      <div class="aj-brand">
        <span class="aj-brand-mark">AJ</span>
        <div class="aj-brand-text">
          <strong>AgendaJeff</strong>
          <span>Agenda modular · Eventos · Recordatorios · Carga masiva</span>
        </div>
      </div>

      <nav class="aj-main-menu" aria-label="Menú superior de AgendaJeff">
        <button class="aj-menu-item is-active" type="button" data-module="inicio">Inicio</button>
        <button class="aj-menu-item" type="button" data-module="agenda">Agenda</button>
        <button class="aj-menu-item" type="button" data-module="carga">Masivo</button>
        <div class="aj-menu-group" id="ajSettingsMenuGroup">
          <button class="aj-menu-item" id="ajSettingsMenuButton" type="button" data-menu-toggle="ajustes" aria-haspopup="true" aria-expanded="false">Ajustes ▾</button>
          <div class="aj-submenu" role="menu" aria-label="Submenú de Ajustes">
            <span class="aj-submenu-title">Conexiones</span>
            <button class="aj-submenu-item" type="button" data-module="googleCalendar" role="menuitem">Google Calendar</button>
            <button class="aj-submenu-item" type="button" data-module="telegram" role="menuitem">Telegram</button>
            <button class="aj-submenu-item" type="button" data-module="notificaciones" role="menuitem">Notificaciones de escritorio</button>
          </div>
        </div>
      </nav>

      <div class="aj-topbar-actions">
        <button id="checkElectronBtn" class="aj-chip" type="button">Verificar Electron</button>
        <span id="runtimeBadge" class="aj-runtime-badge">Verificando...</span>
      </div>
    </header>

    <main class="aj-layout">
      <section class="aj-content-card">
        <iframe id="moduleFrame" class="aj-module-frame" title="Módulo AgendaJeff"></iframe>
      </section>
    </main>

    <footer class="aj-footer">
      <span>AgendaJeff · Modular</span>
      <span id="footerStatus">Inicio · Cargando módulo</span>
    </footer>
  </div>

  <script>
    (function initAgendaJeffShell() {
      "use strict";

      const MODULES = Object.freeze({
        inicio: { key: "inicio", title: "Inicio", src: "modulos/inicio/in-module.html" },
        agenda: { key: "agenda", title: "Agenda", src: "modulos/agenda/ag-module.html" },
        carga: { key: "carga", title: "Masivo", src: "modulos/carga/cm-module.html" },
        telegram: { key: "telegram", title: "Telegram", src: "modulos/telegram/tl-module.html" },
        googleCalendar: { key: "googleCalendar", title: "Google Calendar", src: "modulos/googlecalendar/gc-module.html" },
        notificaciones: { key: "notificaciones", title: "Notificaciones de escritorio", src: "modulos/notificaciones/nt-module.html" }
      });

      const runtimeBadge = document.getElementById("runtimeBadge");
      const checkElectronBtn = document.getElementById("checkElectronBtn");
      const footerStatus = document.getElementById("footerStatus");
      const moduleFrame = document.getElementById("moduleFrame");
      const settingsMenuGroup = document.getElementById("ajSettingsMenuGroup");
      const settingsMenuButton = document.getElementById("ajSettingsMenuButton");

      function setFooter(text) { footerStatus.textContent = text || "AgendaJeff"; }

      function isSettingsArea(moduleKey) {
        return ["googleCalendar", "telegram", "notificaciones"].includes(moduleKey);
      }

      function setActiveModule(moduleKey) {
        document.querySelectorAll(".aj-menu-item[data-module], .aj-submenu-item[data-module]").forEach(function eachButton(button) {
          button.classList.toggle("is-active", button.dataset.module === moduleKey);
        });

        if (settingsMenuButton) settingsMenuButton.classList.toggle("is-active", isSettingsArea(moduleKey));
      }

      function renderWebMode() {
        runtimeBadge.textContent = "Modo navegador";
        runtimeBadge.classList.remove("is-ok");
        runtimeBadge.classList.add("is-warn");
      }

      function renderElectronMode() {
        runtimeBadge.textContent = "Electron activo";
        runtimeBadge.classList.add("is-ok");
        runtimeBadge.classList.remove("is-warn");
      }

      async function checkElectron() {
        const bridge = window.AgendaJeffElectron;
        if (!bridge) { renderWebMode(); return { ok: false, mode: "browser" }; }
        try {
          if (typeof bridge.ping === "function") await bridge.ping();
          renderElectronMode();
          return { ok: true, mode: "electron" };
        } catch (error) {
          runtimeBadge.textContent = "Electron con error";
          runtimeBadge.classList.remove("is-ok");
          runtimeBadge.classList.add("is-warn");
          return { ok: false, mode: "electron", error: error && error.message ? error.message : String(error) };
        }
      }

      function closeSettingsMenu() {
        if (!settingsMenuGroup || !settingsMenuButton) return;
        settingsMenuGroup.classList.remove("is-open");
        settingsMenuButton.setAttribute("aria-expanded", "false");
      }

      function toggleSettingsMenu() {
        if (!settingsMenuGroup || !settingsMenuButton) return;
        const willOpen = !settingsMenuGroup.classList.contains("is-open");
        settingsMenuGroup.classList.toggle("is-open", willOpen);
        settingsMenuButton.setAttribute("aria-expanded", willOpen ? "true" : "false");
      }

      function openModule(moduleKey) {
        const moduleConfig = MODULES[moduleKey];
        if (!moduleConfig) { setFooter("Módulo no registrado"); return; }
        setActiveModule(moduleKey);
        setFooter(`${moduleConfig.title} · Cargando módulo`);
        if (!moduleFrame.src || !moduleFrame.src.endsWith(moduleConfig.src)) moduleFrame.src = moduleConfig.src;
      }

      function wireEvents() {
        checkElectronBtn.addEventListener("click", checkElectron);

        if (settingsMenuButton) {
          settingsMenuButton.addEventListener("click", function handleSettingsMenuClick(event) {
            toggleSettingsMenu();
            event.stopPropagation();
          });
        }

        document.querySelectorAll(".aj-menu-item[data-module], .aj-submenu-item[data-module]").forEach(function eachButton(button) {
          button.addEventListener("click", function handleOpenModule(event) {
            openModule(button.dataset.module);
            closeSettingsMenu();
            event.stopPropagation();
          });
        });

        document.addEventListener("click", function handleDocumentClick(event) {
          if (!settingsMenuGroup || settingsMenuGroup.contains(event.target)) return;
          closeSettingsMenu();
        });

        moduleFrame.addEventListener("load", function handleModuleLoaded() {
          const activeModule = Object.values(MODULES).find(function findModule(moduleConfig) { return moduleFrame.src.endsWith(moduleConfig.src); });
          if (activeModule) setFooter(`${activeModule.title} · Módulo cargado`);
        });
      }

      function init() {
        window.AgendaJeffShell = { openModule, checkElectron, modules: MODULES };
        wireEvents();
        checkElectron();
        openModule("inicio");
      }

      init();
    })();
  </script>
</body>
</html>
